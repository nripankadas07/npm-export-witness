[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-export-witness"
version = "0.1.0"
description = "Resolve an explicit query matrix through a bounded exports-map subset, recording the matching subpath key and selected nested condition trace."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nripanka Das"}]
dependencies = []

[project.scripts]
npm-export-witness = "npm_export_witness:main"

[tool.setuptools]
py-modules = ["npm_export_witness"]
